# Simulation parameters
map_size: [20, 20]
num_obstacles: 10
obstacle_size_range: [0.5, 1.5]

# Robot parameters
start_pos: 'random'
goal_pos: 'random'
radius: 0.5

# LiDAR parameters
lidar_range: 5.0
lidar_fov: 360  # degrees
num_scan_points: 360

# ROS topics
twist_topic: /cmd_vel
scan_topic: /cloud

# Teleop
linear_speed: 0.5
angular_speed: 1.0
