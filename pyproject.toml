[project]
name = "coordinated-navigation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "gymnasium>=1.2.0",
    "imageio[ffmpeg]>=2.37.0",
    "pygame>=2.6.1",
    "pyyaml>=6.0.2",
    "scipy>=1.14",
    "stable-baselines3[extra]>=2.7.0",
    "torch>=2.0",
    "simulation_core",
]

[tool.uv.sources]
simulation_core = { path = "simulation_core", editable = true }

# Install simulation_core as a plain path entry so that the real package
# (simulation_core/simulation_core) wins over the outer simulation_core/ folder,
# which Python would otherwise pick up as a namespace package when commands are
# run from the repository root.
[tool.uv]
config-settings = { editable_mode = "compat" }
